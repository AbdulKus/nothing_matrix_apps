name: Build APK and publish release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glyph-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" || \
                -z "${RELEASE_KEYSTORE_PASSWORD}" || \
                -z "${RELEASE_KEY_ALIAS}" || \
                -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Release signing secrets are incomplete; building the debug fallback."
            exit 0
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/glyphlab-release.p12"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -storepass "${RELEASE_KEYSTORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" > /dev/null

          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          GLYPH_RELEASE_STORE_FILE: ${{ runner.temp }}/glyphlab-release.p12
          GLYPH_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          GLYPH_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          GLYPH_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build installable debug fallback
        if: steps.signing.outputs.configured != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Name APK
        id: apk
        shell: bash
        env:
          RELEASE_SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_LABEL="${GITHUB_REF_NAME}"
          else
            RELEASE_LABEL="nightly"
          fi
          APK_NAME="GlyphLab-${RELEASE_LABEL}.apk"
          if [[ "${RELEASE_SIGNED}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          fi
          echo "name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "signed=${RELEASE_SIGNED}" >> "${GITHUB_OUTPUT}"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Move rolling nightly tag
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        shell: bash
        run: |
          git tag -f nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && format('Glyph Lab {0}', github.ref_name) || 'Glyph Lab — свежая сборка' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          files: ${{ steps.apk.outputs.name }}
          overwrite_files: true
          body: |
            Устанавливаемый APK для Nothing Phone (4a) Pro.

            Nightly обновляется автоматически после каждого успешного изменения в `main`.
            Постоянная release-подпись применяется, когда настроены все signing secrets.
